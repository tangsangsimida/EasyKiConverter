name: Code Format Check

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    name: 'Check clang-format'
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout Source code'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 'Install clang-format'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 python3
          sudo ln -sf "$(command -v clang-format-18)" /usr/local/bin/clang-format

      - name: 'Run clang-format check'
        run: python3 tools/python/format_code.py --check --cpp --dirs src
